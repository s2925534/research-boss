[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corroborly"
version = "0.12.11"
description = "Local-first, evidence-first research workspace engine and CLI."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Pedro Veloso", email = "pedro@veloso.dev" },
]
license = { file = "LICENSE" }
dependencies = [
  "click>=8.1.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.6.0",
  "PyYAML>=6.0.1",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "python-multipart>=0.0.9",
  "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
]
# Optional secondary database backends (Phase 24). SQLite stays the
# always-on, zero-config default with zero new required dependencies;
# these are only imported if CORROBORLY_DB_BACKEND selects one.
postgres = [
  "psycopg2-binary>=2.9.0",
]
mariadb = [
  "PyMySQL>=1.1.0",
]
# Optional Google Scholar fallback provider (option 3 of
# corroborly.engine.scholar_providers.ScholarDataService). Only imported
# lazily inside that module's scholarly-backed provider function; every
# other provider in the pipeline works with zero new dependencies.
scholar = [
  "scholarly>=1.7.0",
]
# Optional institutional (university SSO) full-text access via a real
# browser session -- see corroborly.engine.institutional_access. Only
# imported lazily inside that module. After installing, also run
# `playwright install chromium` once to download the browser binary.
institutional = [
  "playwright>=1.40.0",
]

[project.scripts]
corroborly = "corroborly.cli:app"

[tool.setuptools.packages.find]
include = ["corroborly*"]

[tool.setuptools.package-data]
"corroborly.web" = ["templates/*.html", "static/*.js", "static/*.css"]
